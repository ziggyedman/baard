services:
  - type: web
    name: baard
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/baard.db
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_AUDIENCE_ID_1
        sync: false
      - key: RESEND_AUDIENCE_ID_2
        sync: false
      - key: RESEND_AUDIENCE_ID_3
        sync: false
    disk:
      name: baard-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
